name: Checks and Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - run: tool/fetch-upstream.sh
      - run: node tool/native-licenses.cjs --check
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Check pinned upstream JavaScript and WASM
        working-directory: .upstream/node-tunnel
        env:
          RUSTUP_TOOLCHAIN: '1.100.0'
        run: |
          npm test
          rustup target add wasm32-unknown-unknown
          npm run build:wasm
          npm run test:rust
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - uses: gradle/actions/wrapper-validation@v6
      - uses: ./.github/actions/android-tools
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-warnings --fatal-infos
      - run: tool/fetch-upstream.sh
      - run: flutter test
      - run: flutter build apk --release
      - run: tool/verify-android-apk.sh build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: dirka-android-arm64-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
