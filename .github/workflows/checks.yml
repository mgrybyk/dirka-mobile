name: Checks and Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
      - run: tool/fetch-upstream.sh
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --locked
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
      - name: Set up Temurin JDK 25.0.5.1+2
        run: |
          archive=OpenJDK25U-jdk_x64_linux_hotspot_25.0.5.1_2.tar.gz
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/$archive" \
            --output "$RUNNER_TEMP/$archive"
          echo "760f91b22c3efc9bd1b64ff950598231be82928cc807e30691a0e7a2995a62c0  $RUNNER_TEMP/$archive" | sha256sum -c -
          java_dir="$RUNNER_TEMP/jdk"
          mkdir -p "$java_dir"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$java_dir" --strip-components=1
          echo "JAVA_HOME=$java_dir" >> "$GITHUB_ENV"
          echo "$java_dir/bin" >> "$GITHUB_PATH"
      - name: Set up Flutter 3.50.1
        run: |
          flutter_sdk="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$flutter_sdk"
          echo "$flutter_sdk/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: tool/fetch-upstream.sh
      - run: rustup target add aarch64-linux-android
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-warnings --fatal-infos
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - name: Verify ARM64 APK native libraries and alignment
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -p "$apk" lib/arm64-v8a/libdirka_engine.so > /dev/null
          unzip -p "$apk" lib/arm64-v8a/libnode_tunnel_client.so > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
      - uses: actions/upload-artifact@v7
        with:
          name: dirka-android-arm64-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
