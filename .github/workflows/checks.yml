name: Checks and Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dirka-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run-checks: ${{ steps.filter.outputs.run-checks }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether checks are needed
        id: filter
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { readFileSync, appendFileSync } = require('node:fs')
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const pr = event.pull_request
          const base = pr ? pr.base.sha : event.before
          const head = pr ? pr.head.sha : process.env.GITHUB_SHA
          const ignoredFiles = new Set(['.gitignore', 'android/.gitignore', '.github/dependabot.yml'])
          const isIgnored = file => ignoredFiles.has(file) || file.startsWith('docs/') || file.endsWith('.md')
          let runChecks = true

          if (base && !/^0+$/.test(base)) {
            try {
              // Compare PRs with the merge base and pushes over the entire pushed range.
              // List both paths of a rename so moving code into docs still runs checks.
              const range = `${base}${pr ? '...' : '..'}${head}`
              const files = execFileSync('git', ['diff', '--no-renames', '--name-only', '-z', range], {
                encoding: 'utf8'
              }).split('\0').filter(Boolean)
              runChecks = files.some(file => !isIgnored(file))
            } catch (error) {
              console.warn(`Could not determine changed files; running checks: ${error.message}`)
            }
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `run-checks=${runChecks}\n`)
          console.log(runChecks ? 'Checks required.' : 'No build-related paths changed; skipping checks.')
          NODE

  native:
    needs: changes
    if: needs.changes.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: tool/fetch-upstream.sh
      - run: node tool/native-licenses.cjs --check
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Check pinned upstream JavaScript and WASM
        working-directory: .upstream/node-tunnel
        run: |
          # Use Dirka's toolchain in the upstream Rust crate too.
          RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | awk 'NR == 1 { print $1 }')"
          export RUSTUP_TOOLCHAIN
          npm test
          rustup target add wasm32-unknown-unknown
          npm run build:wasm
          npm run test:rust
  android:
    needs: changes
    if: needs.changes.outputs.run-checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/android-tools
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-warnings --fatal-infos
      - run: tool/fetch-upstream.sh
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
      - run: tool/verify-android-apk.sh build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: dirka-android-arm64-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  status:
    name: CI status
    needs: [changes, native, android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run-checks }}
          NATIVE_RESULT: ${{ needs.native.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [[ "$CHANGES_RESULT" == 'success' ]] &&
             { [[ "$RUN_CHECKS" == 'false' && "$NATIVE_RESULT" == 'skipped' && "$ANDROID_RESULT" == 'skipped' ]] ||
               [[ "$RUN_CHECKS" == 'true' && "$NATIVE_RESULT" == 'success' && "$ANDROID_RESULT" == 'success' ]]; }; then
            echo 'CI passed.'
          else
            echo 'CI failed.'
            exit 1
          fi
